name: Download & Release PW Questions

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Select Batch to Download'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - '11th JEE'
          - '12th JEE'
          - '11th NEET'
          - '12th NEET'

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Maximum 6-hour runtime for GitHub Actions

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Downloader
        run: |
          python master_downloader.py --batch "${{ github.event.inputs.batch }}" --delay 2.5

      # Package Zips ALWAYS (even if timed out or interrupted)
      - name: Package Zips for Each Batch
        if: always()
        run: |
          mkdir -p release_zips
          
          zip_batch() {
            local folder_name="$1"
            local zip_name="$2"
            if [ -d "downloaded_questions/$folder_name" ]; then
              echo "Zipping '$folder_name' into release_zips/$zip_name.zip..."
              (cd "downloaded_questions" && zip -r "../release_zips/$zip_name.zip" "$folder_name")
            else
              echo "Directory 'downloaded_questions/$folder_name' not found. Skipping."
            fi
          }

          zip_batch "11th JEE" "11th_JEE"
          zip_batch "12th JEE" "12th_JEE"
          zip_batch "11th NEET" "11th_NEET"
          zip_batch "12th NEET" "12th_NEET"

          if [ -f "downloaded_questions/state_tracker.json" ]; then
            cp "downloaded_questions/state_tracker.json" "release_zips/state_tracker.json"
          fi

      # Publish GitHub Release ALWAYS (even if 6-hr timeout or cancelled)
      - name: Create GitHub Release & Upload Zips
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}-$(date +'%Y%m%d-%H%M')"
          name: "PW Practice Questions [${{ github.event.inputs.batch }}] - Build #${{ github.run_number }}"
          body: |
            ## 📚 PW Infinite Practice Question Bank
            
            - **Batch Target:** `${{ github.event.inputs.batch }}`
            - **Triggered At:** `$(date -u +'%Y-%m-%d %H:%M:%S UTC')`
            - **Exhaustion Rule:** 10 consecutive empty batches (No hard batch limit).
            - **Subject Filter:** JEE = All Subjects (PCM) | NEET = Biology Only (Botany & Zoology; duplicate Physics & Chemistry skipped).
            
            ### 📦 Direct Downloads:
            - **11th JEE:** `11th_JEE.zip` (Maths, Chemistry, Physics)
            - **12th JEE:** `12th_JEE.zip` (Maths, Chemistry, Physics)
            - **11th NEET:** `11th_NEET.zip` (Botany, Zoology)
            - **12th NEET:** `12th_NEET.zip` (Botany, Zoology)
            - **State Log:** `state_tracker.json`
          files: |
            release_zips/*.zip
            release_zips/*.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
